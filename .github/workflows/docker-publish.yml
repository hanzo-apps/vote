name: Docker

on:
  workflow_dispatch:
  push:
    branches: [main, dev, test]
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: hanzo-apps-build-linux-amd64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # This repo lives in `hanzo-apps` but the image namespace is
      # `ghcr.io/hanzoai`. GITHUB_TOKEN is scoped to hanzo-apps and CANNOT push
      # cross-org to hanzoai, so a PAT with write:packages on hanzoai is required
      # (org/repo secret GHCR_PAT, e.g. the hanzo-dev token). Until that secret
      # is set, the manual evo build is the live path.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: hanzo-dev
          password: ${{ secrets.GHCR_PAT }}

      - name: Compute tags
        id: tags
        run: |
          SHA="${GITHUB_SHA::7}"
          TAGS="ghcr.io/hanzoai/vote:sha-${SHA}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/}"
            TAGS="${TAGS},ghcr.io/hanzoai/vote:${VER}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          # Vite inlines these into the bundle at build time, so they cannot be
          # supplied as runtime container env. VITE_APP_WALLET_CONNECT_PROJECT_ID
          # is the Reown (WalletConnect Cloud) project id; while the secret is
          # unset the build stays green and the app degrades to injected-only
          # wallets, rather than shipping a placeholder id that Reown 403s.
          build-args: |
            GIT_HASH=${{ github.sha }}
            VITE_APP_WALLET_CONNECT_PROJECT_ID=${{ secrets.VITE_APP_WALLET_CONNECT_PROJECT_ID }}
            VITE_APP_SITE_URL=https://hanzo.vote
          tags: ${{ steps.tags.outputs.tags }}
